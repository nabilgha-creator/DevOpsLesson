[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ffk-cloud-lab"
version = "0.1.0"
description = "Application pédagogique de génération de convocations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlmodel>=0.0.24,<0.1",
  "SQLAlchemy>=2.0.36,<2.1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "openai>=3,<4",
  "tzdata>=2025",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",    # client HTTP utilisé par TestClient (FastAPI)
  "httpx2>=2,<3",      # client HTTP utilisé par le SDK openai, simulé dans test_llm.py
  "pypdf>=5,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
